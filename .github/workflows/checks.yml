name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  crosswalks-and-terminology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crosswalk summaries match their rows, and mapped ids exist
        run: python3 tools/check_crosswalks.py
      - name: Term lists are valid against the schema
        run: python3 tools/check_terminology.py
