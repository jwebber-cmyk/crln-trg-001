name: Semgrep

# Free static analysis (Semgrep OSS, official container, no account or token).
# High severity (ERROR) findings only, so it does not fail on noise.
# REPORT-ONLY at first: the job stays green and the findings are in the job
# summary and a SARIF artifact. To make it enforcing, set ENFORCE to "true"
# below and add this job to the required checks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 2" # weekly, Tuesday 06:41 UTC

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (high severity, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENFORCE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Semgrep scan
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            semgrep/semgrep:1.180.0 \
            semgrep scan --config p/default --config p/typescript --config p/secrets --config p/python \
              --severity ERROR --error --metrics=off --sarif --output semgrep.sarif
          echo "SEMGREP_RC=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Summarize findings
        run: |
          python3 - <<'PY'
          import collections, json, os
          rc = os.environ.get("SEMGREP_RC", "?")
          rules = collections.Counter()
          try:
              for run in json.load(open("semgrep.sarif")).get("runs", []):
                  for r in run.get("results", []):
                      rules[r.get("ruleId", "?")] += 1
          except Exception as e:
              print("no SARIF produced:", e)
          total = sum(rules.values())
          lines = [f"### Semgrep: {total} high-severity findings (exit code {rc})", ""]
          lines += [f"- `{k}`: {v}" for k, v in rules.most_common(15)]
          out = "\n".join(lines)
          print(out)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(out + "\n")
          # rc 0 = clean, 1 = findings; anything else means the scan itself broke.
          if os.environ["ENFORCE"] == "true" and rc != "0":
              raise SystemExit(1)
          PY

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30
